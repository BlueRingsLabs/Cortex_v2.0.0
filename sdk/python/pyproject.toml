[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-webhooks"
version = "2.0.0"
description = "Verify and read Cortex webhooks: Standard Webhooks signatures and typed events."
readme = "../README.md"
license = "Apache-2.0"
authors = [{ name = "Gonzalo Luis Romero" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.setuptools]
packages = ["cortex_webhooks"]

[tool.setuptools.package-data]
cortex_webhooks = ["py.typed"]
